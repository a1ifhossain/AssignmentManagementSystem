<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Assignment Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .navbar h2 {
                margin: 0;
            }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout {
            background: #ef4444;
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

            .logout:hover {
                background: #dc2626;
            }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

            .welcome h1 {
                margin-top: 0;
            }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

            .card h3 {
                margin-top: 0;
            }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .assignment {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

            .assignment h3 {
                margin-top: 0;
            }

            .assignment button {
                background: #2563eb;
                color: white;
                border: none;
                padding: 9px 15px;
                border-radius: 6px;
                cursor: pointer;
            }

                .assignment button:hover {
                    background: #1d4ed8;
                }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 650px;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

            .modal-content h2 {
                margin-top: 0;
            }

            .modal-content label {
                display: block;
                font-weight: bold;
                margin-bottom: 8px;
            }

            .modal-content textarea {
                width: 100%;
                min-height: 220px;
                resize: vertical;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-family: Arial, sans-serif;
                font-size: 15px;
            }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        #submissionMessage {
            margin-top: 12px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .user-info {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <h2>Assignment Management System</h2>

        <div class="user-info">
            <span id="userName">User</span>
            <span id="userRole">Role</span>

            <button class="logout" onclick="logout()">
                Logout
            </button>
        </div>

    </div>


    <div class="container">

        <!-- WELCOME -->
        <div class="welcome">

            <h1>
                Welcome, <span id="welcomeName"></span> 👋
            </h1>

            <p id="welcomeRole"></p>

        </div>


        <!-- DASHBOARD CARDS -->
        <div class="cards">

            <div class="card">

                <h3>Assignments</h3>

                <div class="number" id="assignmentCount">
                    0
                </div>

            </div>


            <div class="card">

                <h3>Submissions</h3>

                <div class="number" id="submissionCount">
                    0
                </div>

            </div>


            <div class="card">

                <h3>Your Role</h3>

                <div class="number" id="roleCard">
                    -
                </div>

            </div>

        </div>


        <!-- ASSIGNMENTS -->
        <div class="section">

            <h2>Assignments</h2>

            <div id="assignments">
                Loading assignments...
            </div>

            <p class="message" id="message"></p>

        </div>

        <!-- TEACHER: STUDENT SUBMISSIONS -->
        <div class="section" id="teacherSection">

            <h2>Student Submissions</h2>

            <div id="teacherSubmissions">
                Loading submissions...
            </div>

        </div>

        <!-- STUDENT: MY SUBMISSIONS -->
        <div class="section" id="studentSection">

            <h2>My Submissions</h2>

            <div id="mySubmissions">
                Loading your submissions...
            </div>

        </div>

    </div>


    <!-- SUBMISSION MODAL -->
    <div class="modal" id="submissionModal">

        <div class="modal-content">

            <h2>Submit Assignment</h2>

            <p>
                <strong>Assignment:</strong>
                <span id="modalAssignmentTitle"></span>
            </p>

            <label for="answer">
                Your Answer
            </label>

            <textarea id="answer"
                      placeholder="Write your assignment answer here..."></textarea>

            <p id="submissionMessage"></p>

            <div class="modal-buttons">

                <button class="cancel-btn"
                        onclick="closeSubmissionModal()">
                    Cancel
                </button>

                <button class="submit-btn"
                        onclick="submitAnswer()">
                    Submit Assignment
                </button>

            </div>

        </div>

    </div>


    <script>

        const API_URL = "https://localhost:7071/api";

        const token = localStorage.getItem("token");
        const userData = localStorage.getItem("user");


        // Check login
        if (!token || !userData) {

            window.location.href = "index.html";

        }


        const user = JSON.parse(userData);

        if (user.role !== "Teacher") {
            document.getElementById("teacherSection").style.display = "none";
        }

        // Display user information

        document.getElementById("userName").textContent =
            user.name;

        document.getElementById("userRole").textContent =
            user.role;

        document.getElementById("welcomeName").textContent =
            user.name;

        document.getElementById("welcomeRole").textContent =
            "You are logged in as " + user.role;

        document.getElementById("roleCard").textContent =
            user.role;


        // Currently selected assignment
        let selectedAssignmentId = null;


        // Load assignments

        async function loadAssignments() {

            try {

                const response = await fetch(
                    `${API_URL}/Assignments`,
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load assignments"
                    );

                }


                const assignments =
                    await response.json();


                document.getElementById(
                    "assignmentCount"
                ).textContent = assignments.length;


                const container =
                    document.getElementById(
                        "assignments"
                    );


                container.innerHTML = "";


                if (assignments.length === 0) {

                    container.innerHTML =
                        "<p>No assignments available.</p>";

                    return;

                }


                assignments.forEach(assignment => {

                    const div =
                        document.createElement("div");


                    div.className =
                        "assignment";


                    div.innerHTML = `

                            <h3>
                                ${assignment.title}
                            </h3>

                            <p>
                                ${assignment.description || "No description"}
                            </p>

                            <p>
                                <strong>Deadline:</strong>
                                ${new Date(
                        assignment.deadline
                    ).toLocaleString()}
                            </p>

                            <p>
                                <strong>Maximum Marks:</strong>
                                ${assignment.maxMarks}
                            </p>

                            <p>
                                <strong>Status:</strong>
                                ${assignment.status}
                            </p>

                            ${user.role === "Student"
                            ?
                            `
                                <button
                                    onclick="openSubmissionModal(
                                        ${assignment.id},
                                        '${escapeQuotes(assignment.title)}'
                                    )">

                                    Submit Assignment

                                </button>
                                `
                            :
                            ""
                        }

                        `;


                    container.appendChild(div);

                });


            } catch (error) {

                console.error(error);

                document.getElementById(
                    "assignments"
                ).innerHTML =
                    "<p>Unable to load assignments.</p>";

            }

        }


        // Open submission form

        function openSubmissionModal(
            assignmentId,
            assignmentTitle
        ) {

            selectedAssignmentId =
                assignmentId;


            document.getElementById(
                "modalAssignmentTitle"
            ).textContent =
                assignmentTitle;


            document.getElementById(
                "answer"
            ).value = "";


            document.getElementById(
                "submissionMessage"
            ).textContent = "";


            document.getElementById(
                "submissionModal"
            ).style.display = "flex";

        }


        // Close submission form

        function closeSubmissionModal() {

            document.getElementById(
                "submissionModal"
            ).style.display = "none";

        }


        // Submit answer

        async function submitAnswer() {

            const answer =
                document.getElementById(
                    "answer"
                ).value.trim();


            const message =
                document.getElementById(
                    "submissionMessage"
                );


            if (!answer) {

                message.style.color = "red";

                message.textContent =
                    "Please enter your answer.";

                return;

            }


            if (!selectedAssignmentId) {

                message.style.color = "red";

                message.textContent =
                    "Assignment not selected.";

                return;

            }


            message.style.color = "#555";

            message.textContent =
                "Submitting...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/Submissions`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body: JSON.stringify({

                                answer: answer,

                                assignmentId:
                                    selectedAssignmentId

                            })

                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    message.style.color =
                        "red";

                    message.textContent =
                        "Submission failed: " +
                        errorText;

                    return;

                }


                message.style.color =
                    "green";

                message.textContent =
                    "Assignment submitted successfully!";


                await loadSubmissions();


                setTimeout(() => {

                    closeSubmissionModal();

                }, 1000);


            } catch (error) {

                console.error(error);

                message.style.color =
                    "red";

                message.textContent =
                    "Could not connect to the API.";

            }

        }


        // Load submissions

        async function loadSubmissions() {

            try {

                const response =
                    await fetch(
                        `${API_URL}/Submissions`,
                        {

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                if (!response.ok) {

                    return;

                }


                const submissions =
                    await response.json();


                document.getElementById(
                    "submissionCount"
                ).textContent =
                    submissions.length;


            } catch (error) {

                console.error(error);

            }

        }

        // Teacher: show all submissions
        async function showTeacherSubmissions() {

            if (user.role !== "Teacher") {
                return;
            }

            try {

                const response = await fetch(`${API_URL}/Submissions`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) {
                    throw new Error("Could not load submissions");
                }

                const submissions = await response.json();

                let section = document.getElementById("teacherSubmissions");

                if (!section) {
                    return;
                }

                section.innerHTML = "";

                if (submissions.length === 0) {
                    section.innerHTML = "<p>No submissions yet.</p>";
                    return;
                }

                submissions.forEach(submission => {

                    const div = document.createElement("div");

                    div.className = "assignment";

                    div.innerHTML = `
                <h3>
                    ${submission.assignment?.title || "Assignment"}
                </h3>

                <p>
                    <strong>Student:</strong>
                    ${submission.student?.name || "Student"}
                </p>

                <p>
                    <strong>Answer:</strong>
                    ${submission.answer}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${submission.status}
                </p>

                <p>
                    <strong>Marks:</strong>
                    ${submission.marks ?? "Not graded"}
                </p>

                <p>
                    <strong>Feedback:</strong>
                    ${submission.feedback || "No feedback"}
                </p>

                <button onclick="gradeSubmission(${submission.id})">
                    Grade Submission
                </button>
            `;

                    section.appendChild(div);
                });

            } catch (error) {

                console.error(error);

                document.getElementById("teacherSubmissions").innerHTML =
                    "<p>Unable to load submissions.</p>";
            }
        }

        // Student: show own submissions
        async function showMySubmissions() {

            if (user.role !== "Student") {
                return;
            }

            try {

                const response = await fetch(`${API_URL}/Submissions`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) {
                    throw new Error("Could not load submissions");
                }

                const submissions = await response.json();

                const section = document.getElementById("mySubmissions");

                if (!section) {
                    return;
                }

                section.innerHTML = "";

                const mySubmissions = submissions.filter(
                    submission => submission.studentId === user.id
                );

                if (mySubmissions.length === 0) {
                    section.innerHTML =
                        "<p>You have not submitted any assignments yet.</p>";
                    return;
                }

                mySubmissions.forEach(submission => {

                    const div = document.createElement("div");

                    div.className = "assignment";

                    div.innerHTML = `
                <h3>
                    ${submission.assignment?.title || "Assignment"}
                </h3>

                <p>
                    <strong>Your Answer:</strong>
                    ${submission.answer}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${submission.status}
                </p>

                <p>
                    <strong>Marks:</strong>
                    ${submission.marks ?? "Not graded yet"}
                </p>

                <p>
                    <strong>Feedback:</strong>
                    ${submission.feedback || "No feedback yet"}
                </p>
            `;

                    section.appendChild(div);
                });

            } catch (error) {

                console.error(error);

                document.getElementById("mySubmissions").innerHTML =
                    "<p>Unable to load your submissions.</p>";
            }
        }

        // Logout

        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("user");

            window.location.href =
                "index.html";

        }


        // Prevent quote problems in assignment title

        function escapeQuotes(text) {

            return text
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }

        async function gradeSubmission(submissionId) {

            const marks = prompt("Enter marks:");

            if (marks === null) {
                return;
            }

            const feedback = prompt("Enter feedback:");

            if (feedback === null) {
                return;
            }

            try {

                const getResponse = await fetch(
                    `${API_URL}/Submissions/${submissionId}`,
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                if (!getResponse.ok) {
                    alert("Could not find submission.");
                    return;
                }

                const submission = await getResponse.json();

                const response = await fetch(
                    `${API_URL}/Submissions/${submissionId}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify({
                            id: submissionId,
                            answer: submission.answer,
                            status: "Graded",
                            marks: Number(marks),
                            feedback: feedback,
                            assignmentId: submission.assignmentId
                        })
                    }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    alert("Grading failed: " + errorText);
                    return;
                }

                alert("Submission graded successfully!");

                showTeacherSubmissions();

            } catch (error) {

                console.error(error);

                alert("Could not connect to the API.");
            }
        }

        // Start dashboard

        loadAssignments();
        loadSubmissions();
        showTeacherSubmissions();
        showMySubmissions();

    </script>

</body>
</html>
